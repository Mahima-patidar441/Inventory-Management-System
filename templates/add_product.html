<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product | Inventory Management</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/dashboard.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/add_product.css') }}"
    />
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->
         <aside
      class="sidebar offcanvas-lg offcanvas-start bg-white d-flex flex-column"
      tabindex="-1"
      id="sidebar"
    >
      <div
        class="d-flex align-items-center justify-content-between p-3 border-bottom"
      >
        <a
          href="{{ url_for('dashboard') }}"
          class="d-flex align-items-center gap-2 text-dark text-decoration-none"
        >
          <span class="icon-box bg-primary text-white">
            <i class="bi bi-box-seam"></i>
          </span>

          <span class="fw-bold lh-sm">
            Inventory
            <br />
            <small class="text-muted fw-normal">Management</small>
          </span>
        </a>

        <button
          type="button"
          class="btn-close d-lg-none"
          data-bs-dismiss="offcanvas"
          data-bs-target="#sidebar"
        ></button>
      </div>

      <nav class="flex-grow-1 p-3">
        <p class="small text-uppercase text-muted fw-semibold mb-2">
          Main Menu
        </p>

        <ul class="nav flex-column">
          <li>
            <a class="nav-link" href="{{ url_for('dashboard') }}">
              <i class="bi bi-grid-1x2"></i> Dashboard
            </a>
          </li>

          <li>
            <a class="nav-link " href="{{ url_for('products') }}">
              <i class="bi bi-box"></i> Products
            </a>
          </li>

          <li>
            <a class="nav-link active" href="{{ url_for('add_product') }}">
              <i class="bi bi-plus-square"></i> Add Product
            </a>
          </li>

          <li>
            <a class="nav-link" href="{{ url_for('stock_management') }}">
              <i class="bi bi-arrow-left-right"></i> Stock Management
            </a>
          </li>

          <li>
            <a class="nav-link" href="{{ url_for('low_stock_alerts') }}">
              <i class="bi bi-exclamation-triangle"></i> Low Stock Alerts
            </a>
          </li>

          <li>
            <a class="nav-link" href="{{ url_for('reports') }}">
              <i class="bi bi-bar-chart-line"></i> Reports
            </a>
          </li>
        </ul>
      </nav>

      <div class="p-3 border-top">
        <a class="nav-link text-danger" href="{{ url_for('logout') }}">
          <i class="bi bi-box-arrow-left"></i> Logout
        </a>
      </div>
    </aside>


        <!-- Main Content -->
        <div class="col-md-10 p-4 main-content">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h3 class="fw-bold mb-1">Add New Product</h3>
              <p class="text-muted mb-0">
                Enter product details to add it to your inventory.
              </p>
            </div>

            <a href="{{ url_for('products') }}" class="btn btn-light">
              <i class="bi bi-arrow-left"></i> Back to Products
            </a>
          </div>

          <!-- Product Form -->
          <div class="form-card">
            <form action="{{ url_for('add_product') }}" method="POST">
              <div class="row g-4">
                <div class="col-md-6">
                  <label class="form-label">Product Name *</label>
                  <input
                    type="text"
                    name="product_name"
                    class="form-control"
                    placeholder="Enter product name"
                    required
                  />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Product Category *</label>
                  <select name="category" class="form-select" required>
                    <option value="">Select Category</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Office Supplies">Office Supplies</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Other">Other</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Product Price (₹) *</label>
                  <input
                    type="number"
                    name="price"
                    class="form-control"
                    placeholder="Enter price"
                    min="0.01"
                    step="0.01"
                    required
                  />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Initial Quantity *</label>
                  <input
                    type="number"
                    name="quantity"
                    class="form-control"
                    placeholder="Enter available quantity"
                    min="0"
                    required
                  />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Minimum Stock Level *</label>
                  <input
                    type="number"
                    name="min_stock"
                    class="form-control"
                    placeholder="Enter minimum stock level"
                    min="0"
                    required
                  />
                </div>

                <div class="col-md-12">
                  <label class="form-label">Product Description</label>
                  <textarea
                    name="description"
                    class="form-control"
                    rows="4"
                    placeholder="Enter a short product description"
                  ></textarea>
                </div>
              </div>

              <hr class="my-4" />

              <div class="d-flex justify-content-end gap-2">
                <a
                  href="{{ url_for('products') }}"
                  class="btn btn-light btn-cancel"
                >
                  Cancel
                </a>

                <button type="submit" class="btn-save">
                  <i class="bi bi-check-circle"></i> Save Product
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
